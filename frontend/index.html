<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <title>ZolPo · זול-פה</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bump ?v= when shipping asset changes: busts the browser heuristic cache. -->
  <link rel="stylesheet" href="/assets/css/styles.css?v=13" />
  <link rel="manifest" href='data:application/manifest+json,{"name":"ZolPo","short_name":"ZolPo","start_url":"/","display":"standalone","background_color":"%23f8fafc","theme_color":"%23f8fafc"}' />

  <!-- App modules (order matters: helpers define window.ZP before app.js reads it). -->
  <script src="/assets/js/translit.js?v=13"></script>
  <script src="/assets/js/i18n.js?v=13"></script>
  <script src="/assets/js/api.js?v=13"></script>
  <script src="/assets/js/app.js?v=13"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body class="bg-slate-50 text-slate-900 antialiased">
<div x-data="zolpo()" x-init="init()" :dir="lang === 'he' ? 'rtl' : 'ltr'" class="min-h-screen pb-28">

  <!-- ===================== Header ===================== -->
  <header class="sticky top-0 z-20 bg-slate-50/80 backdrop-blur-xl border-b border-slate-200/70">
    <div class="max-w-3xl mx-auto px-4 pt-5 pb-4">

      <div class="flex items-center justify-between mb-3">
        <h1 class="text-2xl font-bold tracking-tight select-none">
          Zol<span class="text-emerald-500">Po</span>
          <span class="text-slate-400 text-lg font-medium align-middle mx-1">·</span>
          <span class="he text-slate-400 text-lg font-medium align-middle">זול-פה</span>
        </h1>

        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-400 hidden sm:inline" x-text="t('subtitle')"></span>

          <!-- Markets selector -->
          <div class="relative" @click.outside="marketsOpen = false">
            <button @click="marketsOpen = !marketsOpen" :aria-expanded="marketsOpen" aria-haspopup="true"
                    class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-white border border-slate-200
                           shadow-sm text-xs font-semibold text-slate-700 hover:border-emerald-400
                           hover:text-emerald-600 active:scale-95 transition select-none">
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 9l1-5h16l1 5M5 9v11h14V9M9 13h6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span x-text="t('markets')"></span>
              <span class="px-1.5 rounded-full bg-emerald-500 text-white" x-text="selectedIds.length"></span>
            </button>

            <!-- Dropdown -->
            <div x-show="marketsOpen" x-transition.opacity x-cloak role="menu"
                 class="absolute z-40 mt-2 w-[min(18rem,calc(100vw-2rem))] max-h-96 overflow-auto rounded-2xl
                        bg-white border border-slate-200 shadow-2xl p-2 end-0">
              <div class="flex items-center justify-between px-2 py-1.5">
                <p class="text-[11px] uppercase tracking-wide text-slate-400" x-text="t('chooseMarkets')"></p>
                <span class="text-[11px] text-slate-400" x-text="selectedIds.length + '/' + stores.length"></span>
              </div>
              <div class="flex gap-1.5 px-2 pb-2">
                <button @click="selectFood()"
                        class="flex-1 px-2 py-1 rounded-lg border border-slate-200 text-[11px] font-semibold
                               text-slate-600 hover:border-emerald-400 hover:text-emerald-600 transition"
                        x-text="t('foodMarkets')"></button>
                <button @click="resetStores()"
                        class="flex-1 px-2 py-1 rounded-lg border border-slate-200 text-[11px] font-semibold
                               text-slate-600 hover:border-emerald-400 hover:text-emerald-600 transition"
                        x-text="t('reset')"></button>
              </div>
              <template x-for="g in storeGroups()" :key="g.chainKey">
                <div class="mb-1">
                  <p class="flex items-center gap-1.5 px-2 pt-1.5 pb-1 text-[11px] font-bold uppercase tracking-wide text-slate-600">
                    <span class="chain-dot" :style="`--chain-color:${g.color}`"></span>
                    <span x-text="chainHeader(g) + ' · ' + g.stores.length"></span>
                  </p>
                  <template x-for="s in g.stores" :key="s.key">
                    <label class="flex items-start gap-2.5 px-2 py-1.5 rounded-xl hover:bg-slate-50 cursor-pointer">
                      <input type="checkbox" :checked="isStoreSelected(s.key)" @change="toggleStore(s.key)"
                             class="mt-0.5 w-4 h-4 accent-emerald-500 shrink-0" />
                      <span class="min-w-0">
                        <span class="block text-sm font-semibold text-slate-800 truncate"
                              :class="lang === 'he' ? 'he' : ''" x-text="storeLabel(s)"></span>
                        <span class="block text-xs text-slate-400 truncate he"
                              x-text="s.store_name + ' · ' + s.address"></span>
                      </span>
                    </label>
                  </template>
                </div>
              </template>
            </div>
          </div>

          <!-- Language toggle -->
          <button @click="cycleLang()" :title="t('switchLang')" :aria-label="t('switchLang')"
                  class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-white border border-slate-200
                         shadow-sm text-xs font-semibold text-slate-700 hover:border-emerald-400
                         hover:text-emerald-600 active:scale-95 transition select-none">
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" stroke-linecap="round"/>
            </svg>
            <span x-text="langLabel()"></span>
          </button>
        </div>
      </div>

      <!-- Search bar + deals filter -->
      <div class="flex items-center gap-2">
        <div class="relative flex-1">
          <svg class="absolute start-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 flip-icon"
               fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/>
          </svg>
          <input type="search" x-model="query" @input.debounce.300ms="search()"
                 :placeholder="t('searchPlaceholder')" :aria-label="t('searchPlaceholder')" dir="rtl"
                 class="w-full ps-11 pe-4 py-3.5 rounded-2xl bg-white border border-slate-200 shadow-sm
                        text-base placeholder:text-slate-400 focus:outline-none focus:ring-2
                        focus:ring-emerald-400 focus:border-transparent transition" />
        </div>
        <!-- Deals-only toggle -->
        <button @click="toggleDeals()" :aria-pressed="dealsOnly"
                class="shrink-0 flex items-center gap-1.5 px-3 py-3 rounded-2xl border shadow-sm
                       text-sm font-semibold active:scale-95 transition select-none"
                :class="dealsOnly
                          ? 'bg-emerald-500 border-emerald-500 text-white'
                          : 'bg-white border-slate-200 text-slate-600 hover:border-emerald-400 hover:text-emerald-600'">
          <span aria-hidden="true">🏷️</span>
          <span x-text="t('deals')"></span>
        </button>
      </div>

      <!-- Deal-type chips (visible in Deals mode) -->
      <div x-show="dealsOnly" x-transition.opacity x-cloak
           class="mt-2 flex gap-1.5 overflow-x-auto pb-0.5" role="group" :aria-label="t('deals')">
        <button @click="setDealKind('')"
                class="shrink-0 px-2.5 py-1 rounded-full border text-xs font-semibold transition select-none"
                :class="dealKind === ''
                          ? 'bg-emerald-500 border-emerald-500 text-white'
                          : 'bg-white border-slate-200 text-slate-600 hover:border-emerald-400'"
                x-text="t('dealsAll')"></button>
        <template x-for="k in dealKinds()" :key="k">
          <button @click="setDealKind(k)" :aria-pressed="dealKind === k"
                  class="shrink-0 flex items-center gap-1 px-2.5 py-1 rounded-full border text-xs font-semibold transition select-none"
                  :class="dealKind === k
                            ? 'bg-emerald-500 border-emerald-500 text-white'
                            : 'bg-white border-slate-200 text-slate-600 hover:border-emerald-400'">
            <span aria-hidden="true" x-text="kindIcon(k)"></span>
            <span x-text="kindLabel(k)"></span>
          </button>
        </template>
      </div>

      <!-- Last price update -->
      <div x-show="lastUpdate" class="mt-2 flex items-center gap-1.5 text-xs text-slate-400"
           :class="lang === 'he' ? 'flex-row-reverse' : ''">
        <svg class="w-3.5 h-3.5 text-emerald-500 shrink-0" fill="none" stroke="currentColor"
             stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/>
        </svg>
        <span x-text="t('updated') + ' ' + lastUpdateText()"></span>
      </div>

      <!-- Enrichment progress -->
      <div x-show="enriching" class="mt-2 flex items-center gap-2 text-xs text-slate-400">
        <div class="flex-1 h-1 bg-slate-200 rounded-full overflow-hidden">
          <div class="h-full bg-emerald-400 rounded-full transition-all duration-500" :style="`width:${enrichProgress}%`"></div>
        </div>
        <span x-text="t('enriching')"></span>
      </div>
    </div>
  </header>

  <!-- ===================== Product grid ===================== -->
  <main class="max-w-3xl mx-auto px-4 pt-5">

    <template x-if="loading">
      <p class="text-center text-slate-400 py-12" x-text="t('loading')"></p>
    </template>

    <template x-if="!loading && products.length === 0">
      <p class="text-center text-slate-400 py-12" x-text="t('noResults')"></p>
    </template>

    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
      <template x-for="(p, i) in products" :key="p.item_code">
        <article class="pop bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col"
                 :style="`animation-delay:${Math.min(i,10)*20}ms`">

          <div class="aspect-square bg-slate-50 flex items-center justify-center p-3">
            <img :src="p.image_url || placeholder(p.category)" :alt="productName(p)" loading="lazy"
                 @error="$el.src = placeholder(p.category)" class="max-h-full max-w-full object-contain" />
          </div>

          <div class="px-3 pt-2 pb-3 flex flex-col flex-1">
            <p class="text-[11px] uppercase tracking-wide text-slate-400 truncate"
               :class="lang === 'he' ? 'he' : ''" x-text="manufacturerName(p)"></p>
            <h3 class="text-sm font-semibold leading-snug line-clamp-2 min-h-[2.5rem]"
                :class="lang === 'he' || !p.item_name_en ? 'he' : ''" x-text="productName(p)"></h3>

            <!-- Deals: teaser line (best across visible stores) + expandable panel -->
            <div x-show="cardPromo(p)" x-cloak class="mt-1">
              <button @click="togglePromoPanel(p)" :aria-expanded="openPromoCode === p.item_code"
                      class="w-full flex items-center gap-1 text-[11px] leading-snug text-amber-700
                             bg-amber-50 border border-amber-200 rounded-lg px-2 py-1
                             hover:bg-amber-100 active:scale-[0.99] transition text-start">
                <span class="truncate flex-1" :class="lang === 'he' || !cardPromo(p) ? 'he' : ''"
                      :dir="lang === 'he' ? 'rtl' : 'auto'"
                      :title="promoLabel(cardPromo(p))" x-text="promoLabel(cardPromo(p))"></span>
                <span x-show="promoCount(p) > 1" class="shrink-0 px-1 rounded-md bg-amber-200/80 font-bold"
                      x-text="'+' + (promoCount(p) - 1)"></span>
                <svg class="w-3 h-3 shrink-0 transition-transform"
                     :class="openPromoCode === p.item_code ? 'rotate-180' : ''"
                     fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>

              <!-- All active deals for this product, grouped by store -->
              <div x-show="openPromoCode === p.item_code" x-transition.opacity x-cloak
                   class="mt-1 rounded-lg border border-amber-200 bg-amber-50/70 divide-y divide-amber-100
                          max-h-44 overflow-auto">
                <template x-for="e in promoStores(p)" :key="e.store.key">
                  <div class="px-2 py-1.5">
                    <p class="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wide text-slate-500">
                      <span class="chain-dot" :style="`--chain-color:${chainColor(e.store)}`"></span>
                      <span class="truncate" :class="lang === 'he' ? 'he' : ''" x-text="storeLabel(e.store)"></span>
                      <span class="ms-auto font-normal normal-case text-slate-400"
                            x-show="e.list.length > 1" x-text="'×' + e.list.length"></span>
                    </p>
                    <template x-for="(pr, j) in e.list" :key="j">
                      <div class="mt-1 flex items-start gap-1.5 text-[11px] text-amber-800">
                        <span class="shrink-0" :title="kindLabel(pr.kind)" x-text="kindIcon(pr.kind)"></span>
                        <span class="min-w-0 flex-1">
                          <span class="block leading-snug" :class="lang === 'he' ? 'he' : ''"
                                :dir="lang === 'he' ? 'rtl' : 'auto'" x-text="promoText(pr)"></span>
                          <span class="block text-[10px] text-slate-400"
                                x-text="[promoMeta(pr), promoUntilText(pr)].filter(Boolean).join(' · ')"></span>
                        </span>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>

            <!-- One price row per selected market; chain colour dot + cheapest highlight. -->
            <div class="mt-2 space-y-1 text-sm">
              <template x-for="s in visibleStores()" :key="s.key">
                <div class="flex items-center justify-between rounded-lg px-2 py-1 gap-1"
                     :class="isCheapest(p, s.key)
                               ? 'bg-emerald-50 text-emerald-700 font-semibold ring-1 ring-emerald-200'
                               : 'text-slate-500'">
                  <span class="flex items-center gap-1.5 min-w-0">
                    <span class="chain-dot" :style="`--chain-color:${chainColor(s)}`"></span>
                    <span class="truncate" :class="lang === 'he' ? 'he' : ''" x-text="storeLabel(s)"></span>
                    <button x-show="promoFor(p, s.key).length" x-cloak
                            @click="togglePromoPanel(p)" aria-label="deals"
                            class="shrink-0 text-[10px] hover:scale-110 transition"
                            :title="promoLabel(promoFor(p, s.key)[0])">
                      <span aria-hidden="true"
                            x-text="promoFor(p, s.key).length > 1 ? '🏷️×' + promoFor(p, s.key).length : '🏷️'"></span>
                    </button>
                  </span>
                  <span class="shrink-0 ps-1"
                        x-text="p.prices[s.key] != null ? p.prices[s.key].toFixed(2) + ' ₪' : '—'"></span>
                </div>
              </template>
            </div>

            <button @click="addToCart(p)"
                    class="mt-3 w-full py-2 rounded-xl bg-slate-900 text-white text-sm font-medium
                           active:scale-95 transition flex items-center justify-center gap-1">
              <span class="text-lg leading-none">+</span>
              <span x-text="t('add')"></span>
              <span x-show="qtyOf(p.item_code) > 0" class="ms-1 px-1.5 rounded-full bg-emerald-500 text-xs"
                    x-text="qtyOf(p.item_code)"></span>
            </button>
          </div>
        </article>
      </template>
    </div>
  </main>

  <!-- ===================== Sticky basket ===================== -->
  <div x-show="cartCount > 0" x-transition.opacity
       class="fixed bottom-0 inset-x-0 z-30 bg-white/90 backdrop-blur-xl border-t border-slate-200 shadow-2xl">
    <div class="max-w-3xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm text-slate-500">
          <span x-text="cartCount"></span>
          <span x-text="cartCount === 1 ? t('item') : t('items')"></span>
          <span x-text="t('inBasket')"></span>
        </span>
        <button @click="clearCart()" class="text-xs text-slate-400 hover:text-red-500" x-text="t('clear')"></button>
      </div>

      <div class="grid gap-2" :style="`grid-template-columns:repeat(${Math.min(visibleStores().length,3)},minmax(0,1fr))`">
        <template x-for="s in visibleStores()" :key="s.key">
          <div class="rounded-xl px-3 py-2 text-center"
               :class="cheapestBasket() === s.key ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-700'">
            <p class="text-[11px] opacity-80 truncate flex items-center justify-center gap-1" :class="lang === 'he' ? 'he' : ''">
              <span class="chain-dot" :style="`--chain-color:${cheapestBasket() === s.key ? '#fff' : chainColor(s)}`"></span>
              <span x-text="storeLabel(s)"></span>
            </p>
            <p class="text-lg font-bold" x-text="basketTotal(s.key).toFixed(2) + ' ₪'"></p>
          </div>
        </template>
      </div>

      <p class="text-center text-xs text-emerald-600 mt-2" x-show="savings() > 0">
        <span x-text="t('save')"></span>
        <span class="font-semibold" x-text="savings().toFixed(2) + ' ₪'"></span>
        <span x-text="t('byChoosing')"></span>
        <span class="font-semibold" :class="lang === 'he' ? 'he' : ''" x-text="cheapestBasketLabel()"></span>
      </p>
    </div>
  </div>

</div>
</body>
</html>
