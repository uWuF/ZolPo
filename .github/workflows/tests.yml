name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # Pure unit tests — no network, no populated DB: they build their own
      # temporary SQLite file and parse filename/XML fixtures inline.
      - name: Run unit tests
        run: python backend/tests/test_zolpo.py -v
